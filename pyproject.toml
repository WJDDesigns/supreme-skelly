[project]
name = "supreme-skelly"
version = "0.6.1"
description = "Headless controller for Skelly-family animatronics with a web UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "bleak>=0.22",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "lameenc>=1.7",
    "httpx>=0.27",
    "websockets>=13",
    "opencv-python-headless>=4.9",
    "kokoro-onnx>=0.4",
    "tzdata",  # quiet hours use the house's time zone; slim images have no zoneinfo
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
supreme-skelly = "skelly.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["skelly"]
