# Easiest: ./install.sh   (or: docker compose up -d --build)
# Then open http://<mini-pc-name>.local:8420
services:
  skelly:
    build: .
    image: supreme-skelly:latest
    container_name: supreme-skelly
    restart: unless-stopped
    # Host networking keeps BLE and the web UI simple; the UI listens on port 8420.
    network_mode: host
    # Ubuntu's default Docker AppArmor profile blocks D-Bus calls to BlueZ.
    security_opt:
      - apparmor=unconfined
    # Lets the app read the live Bluetooth signal strength from the kernel.
    cap_add:
      - NET_ADMIN
    volumes:
      # BLE goes through the host's BlueZ daemon over D-Bus.
      - /run/dbus:/run/dbus:ro
      # Settings (last device, startup options) survive updates and reboots.
      - ./data:/data
      # The mic and Skelly's Live speaker go through the host's PipeWire (user "skelly", uid 1000).
      # The whole of /run/user, following new mounts, so a restarted sound session is picked up
      # without restarting this container (mounting just .../pulse goes stale when PipeWire restarts).
      - type: bind
        source: /run/user
        target: /run/user
        bind:
          propagation: rslave
      # USB cameras appear here; the cgroup rule below allows video devices only.
      - /dev:/dev
    device_cgroup_rules:
      - "c 81:* rmw"
    environment:
      - SKELLY_DATA_DIR=/data
      - SKELLY_LOG_LEVEL=INFO
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
      # Finds and connects to Skelly by itself at startup and after drops.
      - SKELLY_AUTOCONNECT=1
      # Set to 1 to try the UI without an animatronic.
      - SKELLY_SIMULATE=0
      # Also serve the UI on port 80, so http://skelly.local works without ":8420".
      - SKELLY_EXTRA_PORTS=80
      # Which Bluetooth radio to use: its MAC (stays put across reboots) or hci0, hci1...
      # Set it whenever the box has more than one radio; the default then picks unreliably.
      - SKELLY_BT_ADAPTER=${SKELLY_BT_ADAPTER:-}
