# Easiest: ./install.sh   (or: docker compose up -d --build)
# Then open http://<mini-pc-name>.local:8420
services:
  skelly:
    build: .
    image: supreme-skelly:latest
    container_name: supreme-skelly
    restart: unless-stopped
    # Host networking keeps BLE and the web UI simple; the UI listens on port 8420.
    network_mode: host
    volumes:
      # BLE goes through the host's BlueZ daemon over D-Bus.
      - /run/dbus:/run/dbus:ro
      # Settings (last device, startup options) survive updates and reboots.
      - ./data:/data
    environment:
      - SKELLY_DATA_DIR=/data
      - SKELLY_LOG_LEVEL=INFO
      # Finds and connects to Skelly by itself at startup and after drops.
      - SKELLY_AUTOCONNECT=1
      # Set to 1 to try the UI without an animatronic.
      - SKELLY_SIMULATE=0
