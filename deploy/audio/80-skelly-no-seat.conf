# WirePlumber 0.5+: keep Bluetooth audio on when nobody is logged in.
# By default WirePlumber only offers Bluetooth audio to BlueZ while its user has an active
# login session, so on a headless mini PC Skelly's speaker fails with
# "br-connection-profile-unavailable" as soon as the last SSH session closes.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
