name: Release
# Push a tag like v0.3.0 (matching the VERSION file) and this publishes the GitHub release.
# Every mini PC with automatic updates installs it within about 15 minutes.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Supreme Skelly $GITHUB_REF_NAME" --generate-notes
